# Apple Silicon용 MLX QLoRA 설정.
# 실제 모델/어댑터 경로는 scripts/train_chatbot.py가 실행별 폴더로 덮어씁니다.
model: local_ai/models/qwen3-4b-instruct-2507-mlx-4bit
train: true
fine_tune_type: lora
optimizer: adamw
data: local_ai/dataset
seed: 20260921
num_layers: 12
batch_size: 1
iters: 120
val_batches: -1
learning_rate: 0.000005
steps_per_report: 2
steps_per_eval: 10
save_every: 10
test: false
test_batches: -1
max_seq_length: 512
grad_checkpoint: true
grad_accumulation_steps: 4
mask_prompt: true
lora_parameters:
  keys: ["self_attn.q_proj", "self_attn.v_proj"]
  rank: 8
  dropout: 0.05
  scale: 16.0
